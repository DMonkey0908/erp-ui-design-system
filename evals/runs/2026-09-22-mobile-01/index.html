<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values. Without it the insets are zero and a bottom bar sits under
         the home indicator on every device that has one. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>Deliveries — Courier</title>

    <!-- Restored before the first paint, per core/03-layout.md: which tab, and
         whether a draft is pending. Applied afterwards, the user watches the
         app correct itself on every single launch. -->
    <script>
        try {
            var t = localStorage.getItem('app.tab');
            if (t) document.documentElement.dataset.tab = t;
        } catch (_e) { }
    </script>

    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <div class="viewport">

        <!-- ══ NAVIGATION BAR ════════════════════════════════════════════
             A title, and one contextual action. Never the primary one. -->
        <header class="nav-bar">
            <div class="nav-bar-row">
                <h1 class="nav-title-small">Today</h1>
                <button class="nav-action" type="button" id="refreshBtn" aria-label="Refresh deliveries">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                        <path d="M21 3v6h-6" />
                    </svg>
                </button>
            </div>
            <h2 class="nav-large-title">Deliveries</h2>
        </header>

        <!-- ══ CONTENT ═══════════════════════════════════════════════════ -->
        <main class="content" id="content">

            <!-- One offline indicator, not one badge per row. It says what is
                 queued, because a queued write the user cannot see is a write
                 they assume was lost. -->
            <div class="offline-banner" id="offlineBanner" role="status" hidden>
                <span class="offline-dot" aria-hidden="true"></span>
                <span id="offlineText">Offline — showing deliveries from 08:12</span>
            </div>

            <h3 class="section-header" id="listHeading">Remaining stops</h3>

            <ul class="list" id="rows" aria-labelledby="listHeading"></ul>

            <p class="section-footer" id="listFooter">
                Times are the customer's window, not your arrival estimate.
            </p>

            <div class="empty" id="empty" hidden>
                <p class="empty-title" id="emptyTitle"></p>
                <p class="empty-body" id="emptyBody"></p>
                <button class="btn-primary" type="button" id="emptyAction"></button>
            </div>
        </main>

        <!-- ══ PINNED PRIMARY ACTION ═════════════════════════════════════
             In the reachable arc, above the home indicator. -->
        <div class="pinned">
            <button class="btn-primary" type="button" id="startBtn">Start next stop</button>
        </div>

        <!-- ══ TAB BAR ═══════════════════════════════════════════════════
             Three destinations, each labelled. Height plus the inset. -->
        <nav class="tab-bar" aria-label="Main">
            <a class="tab" href="#" aria-current="page" data-tab="today">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2" />
                    <path d="M3 10h18M8 3v4M16 3v4" />
                </svg>
                Today
                <span class="tab-badge" aria-hidden="true">4</span>
                <span class="sr-only">4 stops remaining</span>
            </a>
            <a class="tab" href="#" data-tab="route">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M4 20l6-16 4 9 6-5" />
                </svg>
                Route
            </a>
            <a class="tab" href="#" data-tab="you">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21a8 8 0 0 1 16 0" />
                </svg>
                You
            </a>
        </nav>

        <!-- ══ SHEET ═════════════════════════════════════════════════════
             Rises from the edge the thumb is at. The confirm is at the
             bottom, inside it - not in the sheet's top bar. -->
        <div class="scrim" id="scrim"></div>

        <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"
            aria-hidden="true">
            <div class="grabber" aria-hidden="true"></div>

            <div class="sheet-head">
                <button class="btn-text" type="button" id="sheetCancel">Cancel</button>
                <h2 class="sheet-title" id="sheetTitle">Reschedule</h2>
                <!-- Balances the row so the title stays centred; carries no
                     action, so it is hidden from assistive tech. -->
                <span class="btn-text" aria-hidden="true" style="visibility:hidden">Cancel</span>
            </div>

            <div class="sheet-body">
                <p class="row-subhead" id="sheetStop">Stop 12 — Nguyễn Thị Mai</p>

                <label class="field">
                    <span class="field-label">New window</span>
                    <select id="windowField">
                        <option value="14:00–16:00">14:00–16:00</option>
                        <option value="16:00–18:00">16:00–18:00</option>
                        <option value="Tomorrow, 09:00–11:00">Tomorrow, 09:00–11:00</option>
                    </select>
                </label>

                <label class="field">
                    <span class="field-label">Customer phone</span>
                    <!-- Keyboard type and autofill set per field: a numeric
                         field that opens a QWERTY keyboard costs two taps and
                         some goodwill, every time. -->
                    <input type="tel" id="phoneField" inputmode="tel" autocomplete="tel"
                        enterkeyhint="next" value="+84 90 234 1180">
                    <span class="field-error" id="phoneError" hidden>Enter a phone number we can reach.</span>
                </label>

                <label class="field">
                    <span class="field-label">Note for the customer</span>
                    <textarea id="noteField" enterkeyhint="done"
                        placeholder="Optional — what they should expect"></textarea>
                </label>
            </div>

            <!-- Pinned inside the sheet, above the keyboard when it is up and
                 above the home indicator always. -->
            <div class="pinned">
                <button class="btn-primary" type="button" id="sheetConfirm">Reschedule stop</button>
            </div>
        </section>

        <!-- Something already done, carrying an undo. Anything needing a
             decision is a sheet, because this leaves while they are reading. -->
        <div class="snackbar" id="snackbar" role="status">
            <span id="snackbarText"></span>
            <button class="snackbar-undo" type="button" id="snackbarUndo">Undo</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
